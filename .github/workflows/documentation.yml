name: Documentation Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v6
        with:
          path: repository
      - uses: oven-sh/setup-bun@v2
      - name: Check documentation
        uses: kitty-crow/code-guards/.github/actions/documentation@main
        with:
          repository-path: ${{ github.workspace }}/repository
