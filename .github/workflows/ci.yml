name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies with Bun
        run: bun install
      - name: Type check
        run: bun run typecheck
      - name: Build TypeScript with Bun
        run: bun run build
      - name: Unit tests with Bun
        run: bun test ./test/*.test.ts
      - name: Strict full self-check with progress
        run: bun dist/src/cli.js --strict --include-tests --progress
