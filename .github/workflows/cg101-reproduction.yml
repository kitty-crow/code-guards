name: CG101 TensorFlow-TS reproduction

on:
  pull_request:
    branches: [optimisation/inference]
    paths:
      - src/guards/type-reuse.ts
      - test/guards.test.ts
      - .github/workflows/cg101-reproduction.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: fixed
      - uses: actions/checkout@v4
        with:
          ref: 947a7c2d2e0f79a91c8f70c47d0ee886f5ec0f26
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: kitty-crow/tensorflow-ts
          ref: 489da56238d3a9ac9453eeb54158c88164fc828d
          path: tensorflow-ts
          submodules: false
      - uses: oven-sh/setup-bun@v2
      - name: Install TensorFlow-TS dependencies
        working-directory: tensorflow-ts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Code-Guards dependencies
        run: |
          (cd fixed && bun install --ignore-scripts)
          (cd baseline && bun install --ignore-scripts)
      - name: Compare deterministic CG101 findings
        run: |
          cat > scan.ts <<'TS'
          import { writeFileSync } from "node:fs";
          import { loadProject } from "./fixed/src/project.ts";
          import { typeReuse as fixed } from "./fixed/src/guards/type-reuse.ts";
          import { typeReuse as baseline } from "./baseline/src/guards/type-reuse.ts";
          const reject = async () => ({ sameConcept: 0, differentConcept: 1 });
          const config = "./tensorflow-ts/tsconfig.code-guards.json";
          const before = (await baseline(loadProject(config), true, reject)).filter(item => item.code === "CG101");
          const after = (await fixed(loadProject(config), true, reject)).filter(item => item.code === "CG101");
          writeFileSync("cg101-before.json", JSON.stringify(before, null, 2));
          writeFileSync("cg101-after.json", JSON.stringify(after, null, 2));
          console.log(JSON.stringify({ before: before.length, after: after.length, difference: after.length - before.length }, null, 2));
          TS
          bun scan.ts
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: cg101-comparison
          path: |
            cg101-before.json
            cg101-after.json
          if-no-files-found: error
